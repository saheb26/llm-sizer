name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Human CLI
        run: llm-sizer --model llama-3-70b --quant q4 --context 8k --concurrent-users 2
      - name: Agent JSON
        run: llm-sizer --model deepseek-r1 --quant q4 --context 32k --concurrent-users 8 --json
      - name: Catalog JSON
        run: llm-sizer --list-models --json
